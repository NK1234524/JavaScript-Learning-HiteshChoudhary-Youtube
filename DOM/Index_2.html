<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM | Practice</title>
</head>
<body style="background-color: #212121; color:#fff">
    <div class="parent">
        <div class="day">Monday</div>
        <div class="day">Tuesday</div>
        <div class="day">Wednesday</div>
        <div class="day">Thursday</div>
        <div class="day">Friday</div>
    </div>    
</body>

<script>
    const parent = document.querySelector('.parent')
    console.log(parent);
    console.log(parent.children);
    for(let i=0 ; i <parent.children.length ;i++){
        console.log(parent.children[i].innerHTML);        
    }

    console.log(parent.firstElementChild);
    console.log(parent.lastElementChild);
    parent.children[2].style.color = "Orange"

    console.log("Node :",parent.childNodes) // It shows the nodes of document query of parent.
    // Document on web is the form of Tree

    function create_element() {
        //Create an Element
    const div = document.createElement('div')
    // Now you can do different properties application here :
    div.className = "main"
    div.id = Math.round(Math.random()*10+1);
    div.setAttribute("title","gnerated title")
    div.style.backgroundColor = "green"
    div.style.padding = "12px"
    // Through div.innerText and create TextNode we can easily add text into it. but the difference is only in the optimistic way of how we will use the tree operation here because the Document is the tree. 
    div.innerText = "Nishant Kumar"
    const addtext = document.createTextNode("Hello")
    div.appendChild(addtext)
    }

    
</script>
</html>
